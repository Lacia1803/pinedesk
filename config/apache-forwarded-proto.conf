# ==============================================================================
#  CHO GLPI BIET REQUEST GOC LA HTTPS (TLS ket thuc tai nginx)
# ==============================================================================
#  VI TRI MOUNT:
#    ./config/apache-forwarded-proto.conf
#      -> /etc/apache2/conf-enabled/zzz-forwarded-proto.conf (ro)
#
#  VAN DE:
#    Kien truc cua he thong la nginx ket thuc TLS o cong 8443 roi proxy sang
#    Apache cua container GLPI qua HTTP:80. Apache cua image glpi/glpi KHONG
#    bat mod_remoteip, cung khong duoc cau hinh trusted proxy, nen PHP chi thay
#    $_SERVER['HTTPS'] rong => GLPI tuong request la HTTP KHONG bao mat.
#
#  HAU QUA NEU KHONG CO FILE NAY:
#    Khi bat 'session.cookie_secure = On' (config/php-custom.ini), GLPI se
#    chan MOI trang bang loi:
#        HTTP 400 - "The web server is configured to allow session cookies
#                    only on secured context (https)..."
#    (Da kiem chung thuc te tren he thong nay: ca trang dang nhap lan sau khi
#     dang nhap deu tra 400.) Day KHONG phai loi cua cookie_secure, ma la vi
#    GLPI khong duoc cho biet request goc da di qua HTTPS.
#
#  CACH XU LY:
#    Chuyen tiep tin hieu HTTPS do nginx gui qua header X-Forwarded-Proto
#    (xem nginx/conf.d/default.conf: proxy_set_header X-Forwarded-Proto $scheme)
#    thanh bien HTTPS ma PHP doc duoc. GLPI se nhan dien dung context bao mat.
#
#  VI SAO AN TOAN:
#    - Chi ap dung khi request THUC SU di qua nginx va mang header "https".
#      Truy cap truc tiep vao Apache ma KHONG co header van bi chan 400
#      => khong the lach qua cong HTTP de lay cookie bao mat.
#    - KHONG dat SERVER_PORT: de GLPI giu nguyen cong 8443 khi sinh URL.
#      Neu ep SERVER_PORT=443, cac lien ket do GLPI sinh ra se mat cong :8443.
# ==============================================================================

SetEnvIf X-Forwarded-Proto "^https$" HTTPS=on
