; ==============================================================================
;  CAU HINH PHP TUY CHINH CHO GLPI 11
;  File nay duoc mount vao container - KHONG sua file goc cua image
;
;  VI TRI MOUNT:
;    ./config/php-custom.ini  ->  /usr/local/etc/php/conf.d/zz-custom.ini (ro)
;
;  THU TU NAP: php.ini  ->  conf.d/*.ini (theo alphabet)
;    - glpi.ini      (do image cung cap)  nap TRUOC
;    - zz-custom.ini (file nay, tien to 'zz') nap SAU CUNG
;  => Gia tri o day SE THANG khi trung khoa voi glpi.ini.
;     Chi ghi vao day khi THUC SU muon ghi de cau hinh cua image.
;
;  LUU Y VE EXTENSION:
;    Image glpi/glpi:11.0.0 DA bat san TAT CA extension can thiet qua cac file
;    /usr/local/etc/php/conf.d/docker-php-ext-*.ini, bao gom:
;       apcu, bcmath, bz2, exif, gd, intl, ldap, mysqli,
;       opcache, redis, soap, sodium, zip
;    Cac extension con lai (mbstring, openssl, curl, dom, fileinfo, simplexml,
;    tokenizer, xmlreader, xmlwriter, zlib, ctype, iconv...) duoc bien dich san
;    TRONG PHP core (khong phai file .so rieng).
;
;    => TUYET DOI KHONG khai bao 'extension=...' cho cac extension tren,
;       neu khong se sinh canh bao:
;         "Module X is already loaded"  hoac
;         "Unable to load dynamic library X"
;
;  LUU Y VE PHP CLI:
;    PHP CLI (dong lenh) TU EP max_execution_time=0 va max_input_time=-1,
;    nen chay 'php -r' se thay gia tri khac voi web. Muon do gia tri THAT
;    phai do qua web server (Apache handler). Day KHONG phai loi cau hinh.
; ==============================================================================

; ---------- Gioi han tai nguyen ----------
; Tang gioi han de dinh kem anh su co, ho so thiet bi va xuat bao cao
upload_max_filesize = 64M
post_max_size = 64M
memory_limit = 512M
max_execution_time = 600
max_input_time = 600
max_input_vars = 5000

; ---------- Mui gio ----------
date.timezone = Asia/Ho_Chi_Minh

; ---------- BAO MAT PHIEN LAM VIEC ----------
; Chan JavaScript doc cookie phien (chong XSS danh cap phien dang nhap).
; TRUNG voi glpi.ini (cung gia tri On) - ghi lai cho ro rang, khong giam bao mat.
session.cookie_httponly = On

; Chan cookie gui cheo trang (chong CSRF).
; LUU Y: glpi.ini cua image dat 'Strict' (muc bao ve CAO NHAT).
;       Ban dau file nay dat 'Lax' -> VO TINH LAM YEU he thong.
;       Da khoi phuc ve 'Strict'. Chi ha xuong 'Lax' neu can SSO/OAuth
;       lien ket tu he thong ngoai (hien tai KHONG dung).
session.cookie_samesite = Strict

; Chi gui cookie qua HTTPS (chong danh cap phien qua HTTP).
; DA BAT. Di kem BAT BUOC voi:
;   - config/apache-forwarded-proto.conf  (chuyen tiep tin hieu HTTPS tu nginx)
;   - healthcheck cua service glpi trong docker-compose.yml (co gui header)
; Neu thieu 2 thu tren, GLPI se chan MOI trang bang loi HTTP 400:
;   "The web server is configured to allow session cookies only on secured
;    context (https)..."
; Vi sao: nginx ket thuc TLS o :8443 roi proxy sang Apache qua HTTP:80; Apache
; cua image khong bat mod_remoteip nen PHP khong tu biet request goc la HTTPS.
; File apache-forwarded-proto.conf buoc lai thong tin do.
session.cookie_secure = On

; Thoi gian song cua phien: 8 gio (mot ngay lam viec)
session.gc_maxlifetime = 28800

; ---------- An thong tin phien ban PHP (giam phoi bay thong tin) ----------
expose_php = Off

; ---------- Ghi log loi de debug ----------
log_errors = On
; /var/glpi/logs la GLPI_LOG_DIR THAT cua image glpi/glpi:11.0.0 (da kiem
; chung bang cach boot kernel: GLPI_LOG_DIR=/var/glpi/logs). Thu muc nay song
; trong lop container, xem tu host qua 'docker exec pinedesk-glpi cat ...'.
; Tep rieng 'php-error.log' (so it) de khong lan voi 'php-errors.log' (so
; nhieu) ma chinh GLPI ghi qua Toolbox::logInFile.
error_log = /var/glpi/logs/php-error.log
