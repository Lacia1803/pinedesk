# ==============================================================================
# HE THONG HO TRO KY THUAT (PINEDESK) - TRUONG DAI HOC
# Nen tang: GLPI 11 - Ma nguon mo ITSM (GPL v3)
# Kien truc: Nginx Gateway + GLPI App + MariaDB + Redis
# ==============================================================================

services:

  # --------------------------------------------------------------------------
  # 1. Nginx Gateway - Reverse Proxy, HTTPS, bao mat
  # --------------------------------------------------------------------------
  nginx:
    image: nginx:1.27-alpine
    container_name: pinedesk-gateway
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8080}:80"
      - "${HTTPS_PORT:-8443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # default.conf la TEMPLATE (con ${HTTPS_PORT} trong redirect HTTP->HTTPS):
      # mount vao /etc/nginx/templates de entrypoint cua image nginx chay
      # envsubst, sinh ra /etc/nginx/conf.d/default.conf trong container.
      # KHONG mount truc tiep vao /etc/nginx/conf.d — file con nguyen
      # ${HTTPS_PORT} nen nginx se bao "unknown variable HTTPS_PORT".
      - ./nginx/conf.d/default.conf:/etc/nginx/templates/default.conf.template:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./themes/pics/logos:/usr/share/nginx/html/logos:ro
      # Tai lieu du an: phuc vu truc tiep qua gateway.
      # Chi doc, va chi nam trong thu muc tai lieu -> khong lo ma nguon.
      - ./tai-lieu:/usr/share/nginx/html/tai-lieu:ro
      - ./README.md:/usr/share/nginx/html/README.md:ro
    environment:
      # Doi cong HTTPS trong .env -> redirect HTTP->HTTPS trong template doi
      # theo (truoc day hardcode :8443 nen doi cong la redirect tro vao cong chet).
      HTTPS_PORT: ${HTTPS_PORT:-8443}
    depends_on:
      glpi:
        condition: service_healthy
    networks:
      - frontend_net
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # --------------------------------------------------------------------------
  # 2. GLPI - Ung dung ITSM chinh (Asset + Helpdesk + Bảo trì + Dashboard)
  # --------------------------------------------------------------------------
  glpi:
    image: glpi/glpi:11.0.0
    container_name: pinedesk-glpi
    restart: unless-stopped
    environment:
      GLPI_DB_HOST: mariadb
      GLPI_DB_PORT: 3306
      GLPI_DB_NAME: ${GLPI_DB_NAME:-glpi}
      GLPI_DB_USER: ${GLPI_DB_USER:-glpi_user}
      # `:?` = bat buoc phai dat va KHONG duoc rong. Thieu bien -> Compose dung
      # han voi thong bao ro rang, thay vi am tham chay voi mat khau RONG
      # (truoc day `docker compose up` voi .env thieu van khoi dong binh thuong
      #  -> he thong mo cong khai ma khong co mat khau).
      GLPI_DB_PASSWORD: ${GLPI_DB_PASSWORD:?Thieu GLPI_DB_PASSWORD trong .env - xem .env.example}
      GLPI_SKIP_AUTOINSTALL: "false"
      GLPI_SKIP_AUTOUPDATE: "false"
      TZ: ${APP_TIMEZONE:-Asia/Ho_Chi_Minh}
    volumes:
      # ---------------------------------------------------------------------
      # QUAN TRONG: Image glpi/glpi dung /var/glpi lam THU MUC DU LIEU
      # (khong phai /var/www/glpi). Cac file cau hinh, upload, phien lam viec,
      # bang mau tu tao, ban dich deu nam trong /var/glpi.
      #   /var/glpi/config       -> config_db.php, ...
      #   /var/glpi/files        -> _themes, _locales, _uploads, _cache, _log
      #   /var/glpi/marketplace  -> plugin tai tu cho plugin
      #   /var/www/glpi/plugins  -> plugin cai thu cong
      # ---------------------------------------------------------------------
      - glpi_config:/var/glpi/config
      - glpi_marketplace:/var/glpi/marketplace
      - glpi_files:/var/glpi/files
      # Log loi PHP cua GLPI (GLPI_LOG_DIR=/var/glpi/logs). Image khai bao
      # VOLUME /var/glpi -> neu KHONG mount rieng, thu muc logs nam trong
      # volume VO DANH, se bi xoa boi 'docker compose down -v' (chinh la lenh
      # don dep cua CI) va khong nam trong backup theo named volume nao.
      - glpi_logs:/var/glpi/logs
      # Cau hinh PHP tuy chinh: tang upload, timezone, bao mat phien
      - ./config/php-custom.ini:/usr/local/etc/php/conf.d/zz-custom.ini:ro
      # Chuyen tiep tin hieu HTTPS tu nginx -> Apache (de 'session.cookie_secure'
      # hoat dong duoc). Xem giai thich day du trong chinh file cau hinh.
      - ./config/apache-forwarded-proto.conf:/etc/apache2/conf-enabled/zzz-forwarded-proto.conf:ro
      # Bang mau giao dien tu tuy bien (GLPI quet thu muc nay tim *.scss)
      - ./themes:/var/glpi/files/_themes
      # Plugin tu cai (barcode/QR, ...) - giu lai khi nang cap container
      - glpi_plugins:/var/www/glpi/plugins
      # Plugin giao dien thuong hieu DLU (CSS ghi de + logo).
      # Mount nested: duong dan cu the hon se thang, nen plugin nay nam
      # tren dia host (de sua truc tiep) ma KHONG mat plugin barcode.
      - ./plugins/dlubrand:/var/www/glpi/plugins/dlubrand
      # Plugin thuc thi han muc nop phieu (T3/T4/T6) — chan that o hook
      # PRE_ITEM_ADD, khong sua loi GLPI. Xem plugins/pinedesk/.
      - ./plugins/pinedesk:/var/www/glpi/plugins/pinedesk
    depends_on:
      mariadb:
        condition: service_healthy
    healthcheck:
      # Container glpi/glpi co san curl. Kiem tra Apache tra 200/302.
      # Giu nguyen exit code cua curl de healthcheck phan anh dung trang thai.
      # LUU Y: phai gui kem header X-Forwarded-Proto: https, vi khi
      # session.cookie_secure=On thi GLPI chan request khong o context bao mat
      # (tra 400). Xem config/apache-forwarded-proto.conf.
      test: ["CMD-SHELL", "curl -fsS -H 'X-Forwarded-Proto: https' -o /dev/null http://127.0.0.1:80/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    networks:
      - frontend_net
      - backend_net

  # --------------------------------------------------------------------------
  # 3. MariaDB - Co so du lieu
  # --------------------------------------------------------------------------
  mariadb:
    image: mariadb:10.11
    container_name: pinedesk-db
    restart: unless-stopped
    command: >
      --default-time-zone="+07:00"
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --innodb-buffer-pool-size=512M
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Thieu DB_ROOT_PASSWORD trong .env - xem .env.example}
      MARIADB_DATABASE: ${GLPI_DB_NAME:-glpi}
      MARIADB_USER: ${GLPI_DB_USER:-glpi_user}
      MARIADB_PASSWORD: ${GLPI_DB_PASSWORD:?Thieu GLPI_DB_PASSWORD trong .env - xem .env.example}
      TZ: ${APP_TIMEZONE:-Asia/Ho_Chi_Minh}
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./backup:/backup
    networks:
      - backend_net
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # --------------------------------------------------------------------------
  # 4. Redis - Cache phien lam viec, tang toc do
  # --------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: pinedesk-redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:?Thieu REDIS_PASSWORD trong .env - xem .env.example}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?Thieu REDIS_PASSWORD trong .env - xem .env.example}
    volumes:
      - redis_data:/data
    networks:
      - backend_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

networks:
  # Mang "mat tien": chi nginx va glpi. Co gateway ra ngoai Internet
  # (glpi can Internet de tai plugin tu marketplace, kiem tra cap nhat...).
  frontend_net:
    name: pinedesk-frontend-network
    driver: bridge

  # Mang "hau truong": chi glpi, mariadb, redis. KHONG co gateway ra ngoai.
  # => mariadb va redis bi co lap hoan toan voi Internet (dung nhu thiet ke:
  #    chung chi phuc vu glpi, khong bao gio can ra ngoai).
  #    glpi van ra duoc Internet nhe nho mang frontend_net o tren.
  #    (Truoc day dat internal: false -> comment noi "chi giao tiep noi bo"
  #     la SAI thuc te, vi DB/Redis van co the goi ra ngoai.)
  #
  # LUU Y KHI DOI GIA TRI 'internal':
  #   Docker KHONG doi duoc co internal cua mot mang dang ton tai. Khi doi,
  #   Compose se tao LAI mang, nhung container dang chay chi duoc gan lai ma
  #   KHONG dang ky lai "alias" dich vu (vd 'mariadb'). Hau qua: GLPI mat ket
  #   noi DB ("Unable to connect to database" -> auto-install -> restart loop),
  #   du 'docker network inspect' van thay container nam trong mang.
  #   => Sau khi doi 'internal', PHAI chay lai tu dau:
  #         docker compose down && docker compose up -d
  #      (khong du chi 'up -d'). Volume la named volume nen KHONG mat du lieu.
  backend_net:
    name: pinedesk-backend-network
    driver: bridge
    internal: true

volumes:
  mariadb_data:
    name: pinedesk-mariadb-data
  redis_data:
    name: pinedesk-redis-data
  glpi_config:
    name: pinedesk-glpi-config
  glpi_marketplace:
    name: pinedesk-glpi-marketplace
  glpi_files:
    name: pinedesk-glpi-files
  glpi_plugins:
    name: pinedesk-glpi-plugins
  glpi_logs:
    name: pinedesk-glpi-logs
