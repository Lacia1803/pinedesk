# ==============================================================================
# HE THONG HO TRO KY THUAT (IT HELPDESK) - TRUONG DAI HOC
# Nen tang: GLPI 11 - Ma nguon mo ITSM (GPL v3)
# Kien truc: Nginx Gateway + GLPI App + MariaDB + Redis
# ==============================================================================

services:

  # --------------------------------------------------------------------------
  # 1. Nginx Gateway - Reverse Proxy, HTTPS, bao mat
  # --------------------------------------------------------------------------
  nginx:
    image: nginx:1.27-alpine
    container_name: helpdesk-gateway
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8080}:80"
      - "${HTTPS_PORT:-8443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./landing:/usr/share/nginx/html/landing:ro
    depends_on:
      glpi:
        condition: service_healthy
    networks:
      - frontend_net
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # --------------------------------------------------------------------------
  # 2. GLPI - Ung dung ITSM chinh (Asset + Helpdesk + Bảo trì + Dashboard)
  # --------------------------------------------------------------------------
  glpi:
    image: glpi/glpi:11.0.0
    container_name: helpdesk-glpi
    restart: unless-stopped
    environment:
      GLPI_DB_HOST: mariadb
      GLPI_DB_PORT: 3306
      GLPI_DB_NAME: ${GLPI_DB_NAME:-glpi}
      GLPI_DB_USER: ${GLPI_DB_USER:-glpi_user}
      GLPI_DB_PASSWORD: ${GLPI_DB_PASSWORD}
      GLPI_SKIP_AUTOINSTALL: "false"
      GLPI_SKIP_AUTOUPDATE: "false"
      TZ: ${APP_TIMEZONE:-Asia/Ho_Chi_Minh}
    volumes:
      # ---------------------------------------------------------------------
      # QUAN TRONG: Image glpi/glpi dung /var/glpi lam THU MUC DU LIEU
      # (khong phai /var/www/glpi). Cac file cau hinh, upload, phien lam viec,
      # bang mau tu tao, ban dich deu nam trong /var/glpi.
      #   /var/glpi/config       -> config_db.php, ...
      #   /var/glpi/files        -> _themes, _locales, _uploads, _cache, _log
      #   /var/glpi/marketplace  -> plugin tai tu cho plugin
      #   /var/www/glpi/plugins  -> plugin cai thu cong
      # ---------------------------------------------------------------------
      - glpi_config:/var/glpi/config
      - glpi_marketplace:/var/glpi/marketplace
      - glpi_files:/var/glpi/files
      # Cau hinh PHP tuy chinh: tang upload, timezone, bao mat phien
      - ./config/php-custom.ini:/usr/local/etc/php/conf.d/zz-custom.ini:ro
      # Bang mau giao dien tu tuy bien (GLPI quet thu muc nay tim *.scss)
      - ./themes:/var/glpi/files/_themes
      # Plugin tu cai (barcode/QR, ...) - giu lai khi nang cap container
      - glpi_plugins:/var/www/glpi/plugins
      # Plugin giao dien thuong hieu DLU (CSS ghi de + logo).
      # Mount nested: duong dan cu the hon se thang, nen plugin nay nam
      # tren dia host (de sua truc tiep) ma KHONG mat plugin barcode.
      - ./plugins/dlubrand:/var/www/glpi/plugins/dlubrand
    depends_on:
      mariadb:
        condition: service_healthy
    healthcheck:
      # Container glpi/glpi co san curl. Kiem tra Apache tra 200/302.
      # Giu nguyen exit code cua curl de healthcheck phan anh dung trang thai.
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://127.0.0.1:80/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    networks:
      - frontend_net
      - backend_net

  # --------------------------------------------------------------------------
  # 3. MariaDB - Co so du lieu
  # --------------------------------------------------------------------------
  mariadb:
    image: mariadb:10.11
    container_name: helpdesk-db
    restart: unless-stopped
    command: >
      --default-time-zone="+07:00"
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --innodb-buffer-pool-size=512M
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${GLPI_DB_NAME:-glpi}
      MARIADB_USER: ${GLPI_DB_USER:-glpi_user}
      MARIADB_PASSWORD: ${GLPI_DB_PASSWORD}
      TZ: ${APP_TIMEZONE:-Asia/Ho_Chi_Minh}
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./backup:/backup
    networks:
      - backend_net
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # --------------------------------------------------------------------------
  # 4. Redis - Cache phien lam viec, tang toc do
  # --------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: helpdesk-redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks:
      - backend_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

networks:
  frontend_net:
    name: helpdesk-frontend-network
    driver: bridge
  backend_net:
    name: helpdesk-backend-network
    driver: bridge
    internal: false

volumes:
  mariadb_data:
    name: helpdesk-mariadb-data
  redis_data:
    name: helpdesk-redis-data
  glpi_config:
    name: helpdesk-glpi-config
  glpi_marketplace:
    name: helpdesk-glpi-marketplace
  glpi_files:
    name: helpdesk-glpi-files
  glpi_plugins:
    name: helpdesk-glpi-plugins
