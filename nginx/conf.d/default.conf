# ==============================================================================
#  CAU HINH GATEWAY CHO GLPI - BAO MAT + HTTPS
# ==============================================================================
#  DAY LA TEMPLATE, KHONG PHAI FILE CAU HINH TINH:
#    Image nginx:1.27-alpine co san /docker-entrypoint.d/20-envsubst-on-templates.sh
#    -> khi container khoi dong, moi file *.template trong /etc/nginx/templates
#       duoc thay bien moi truong roi ghi ra /etc/nginx/conf.d/<ten-file>.
#    docker-compose.yml mount file nay vao /etc/nginx/templates/ va truyen
#    bien HTTPS_PORT. NHO VAY, doi cong HTTPS trong .env thi cong trong
#    redirect HTTP->HTTPS (ben duoi) TU DONG doi theo — truoc day hardcode
#    :8443 nen doi HTTPS_PORT la redirect tro vao cong chet.
#    => KHONG mount truc tiep file nay vao /etc/nginx/conf.d: no con nguyen
#       bien HTTPS_PORT dang ${...} nen nginx -t se bao "unknown variable
#       HTTPS_PORT". Khi test bang tay phai truyen -e HTTPS_PORT=... va mount
#       vao /etc/nginx/templates (xem tai-lieu/README.md muc 7).

# ------------------------------------------------------------------------------
#  EP NGON NGU TIENG VIET CHO KHACH CHUA DANG NHAP
# ------------------------------------------------------------------------------
#  VAN DE:
#    GLPI 11 chon ngon ngu theo thu tu uu tien:
#      1. $_SESSION['glpilanguage'] (neu da co)
#      2. Session::getPreferredLanguage() -> doc header Accept-Language cua
#         TRINH DUYET, tra ve ngon ngữ dau tien ma GLPI ho tro
#      3. $CFG_GLPI['language'] (chi la phuong an cuoi)
#
#    Trinh duyet cai san tieng Anh se gui "en-US,en;q=0.9" -> GLPI khop "en_GB"
#    -> trang dang nhap hien TIENG ANH, du da dat mac dinh la vi_VN.
#
#    KHONG THE sua bang plugin: thu tu khoi dong cua GLPI 11 la
#      SessionStart (uu tien 130) -> LoadLanguage (120) -> InitializePlugins (110)
#    Plugin chi chay o buoc 110, tuc SAU khi ngon ngu da nap xong.
#
#  GIAI PHAP (khong sua ma nguon loi):
#    Ghi de header Accept-Language thanh vi-VN ngay tai gateway. Nho vay
#    getPreferredLanguage() luon tra ve vi_VN cho khach chua dang nhap.
#
#  AN TOAN:
#    Chi ap dung cho cac trang cong khai TRUOC dang nhap (/, /index.php,
#    login, quen mat khau), KHONG ap dung cho nguoi da dang nhap -> ton
#    trong lua chon ngon ngu cua tung tai khoan.
# ------------------------------------------------------------------------------
map $uri $dlu_accept_language {
    default                    $http_accept_language;
    # Neo cuoi `(/|$)` de bat ca URI kem PATH_INFO (/index.php/x) - neu chi
    # khop `$` thi GLPI van chay index.php nhung map khong khop -> mat ep
    # tieng Viet (cung loai loi lach rate limit, xem chu thich o location).
    "~^/(index\.php)?(/|$)"      "vi-VN,vi;q=0.9,en;q=0.8";
    "~^/front/login\.php"        "vi-VN,vi;q=0.9,en;q=0.8";
    "~^/front/lostpassword\.php" "vi-VN,vi;q=0.9,en;q=0.8";
}

# ------------------------------------------------------------------------------
#  CHINH SACH X-FORWARDED-FOR (ap dung cho MOI location proxy ben duoi)
# ------------------------------------------------------------------------------
#  VI SAO GHI DE (khong dung $proxy_add_x_forwarded_for):
#    GLPI doc THANG header X-Forwarded-For lam dia chi nguon:
#      - src/Auth.php   : $ip = getenv("HTTP_X_FORWARDED_FOR") ?: getenv("REMOTE_ADDR")
#      - src/Agent.php  : explode(', ', $_SERVER['HTTP_X_FORWARDED_FOR'])[0]
#    $proxy_add_x_forwarded_for NOI gia tri do client tu gui vao TRUOC
#    $remote_addr -> ai cung co the gui "X-Forwarded-For: 1.2.3.4" de
#    gia mao IP trong log dang nhap that bai / nhat ky kiem toan.
#    He thong chi co MOT tang proxy (nginx ket thuc TLS) -> gia tri dung
#    chinh la $remote_addr; ghi de loai bo hoan toan gia tri gia.
# ------------------------------------------------------------------------------

# ------------------------------------------------------------------------------
#  HTTP: chi dung de chuyen huong sang HTTPS
# ------------------------------------------------------------------------------
server {
    listen 80;
    server_name localhost pinedesk.local _;

    # Endpoint kiem tra suc khoe cho Docker healthcheck
    location = /healthz {
        access_log off;
        # Dung default_type (KHONG dung add_header): lenh `return` sinh
        # Content-Type tu default_type; add_header chi THEM header thu hai
        # trung lap -> response co 2 dong Content-Type (da kiem chung thuc te).
        default_type text/plain;
        return 200 "OK\n";
    }

    # Cho phep ACME challenge neu dung Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        # Cong HTTPS lay tu bien HTTPS_PORT (xem chu thich dau file). Bien
        # nay duoc envsubst dien luc container khoi dong; docker-compose.yml
        # luon truyen gia tri (mac dinh 8443) nen file cau hinh thuc te
        # khong bao gio con bien nay.
        return 301 https://$host:${HTTPS_PORT}$request_uri;
    }
}

# ------------------------------------------------------------------------------
#  HTTPS: cong chinh
# ------------------------------------------------------------------------------
server {
    listen 443 ssl;
    http2 on;
    server_name localhost pinedesk.local _;

    root /var/www/glpi/public;

    # ---------- Chung chi SSL (self-signed cho mang noi bo) ----------
    ssl_certificate     /etc/nginx/ssl/glpi.crt;
    ssl_certificate_key /etc/nginx/ssl/glpi.key;

    # Chi cho phep TLS 1.2 va 1.3 (loai bo giao thuc cu khong an toan)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # ---------- Gioi han kich thuoc upload (anh su co, tai lieu) ----------
    client_max_body_size 64M;
    client_body_timeout 600s;

    # ---------- HEADER BAO MAT ----------
    # Chong clickjacking (nhung trang khong bi nhung vao iframe la)
    add_header X-Frame-Options "SAMEORIGIN" always;
    # Chong doan noi dung MIME
    add_header X-Content-Type-Options "nosniff" always;
    # Gioi han thong tin gui kem khi chuyen trang
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Bat buoc HTTPS trong 1 nam
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # Tat tinh nang trinh duyet nguy hiem
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Content-Security-Policy: CHUA ap dung o tang gateway.
    # GLPI 11 sinh rat nhieu inline script/style tu template (khong the gan
    # nonce tu nginx), nen CSP nghiem se lam vo giao dien quan tri. Chong
    # clickjacking hien duoc dam bao bang X-Frame-Options: SAMEORIGIN o tren.
    # Khi GLPI ho tro nonce cho CSP thi bo sung tai day.

    # ---------- CHAN TRUY CAP FILE NHAY CAM ----------
    # Chan file an (.env, .git, ...)
    location ~ /\. {
        deny all;
        return 404;
    }

    # Chan tai file cau hinh, log, sao luu.
    # LUU Y: KHONG chan .png/.json/.md o day, vi:
    #   - .png : logo thuong hieu DLU va anh trong giao dien
    #   - .json: GLPI 11 nap nhieu manifest/ban dich dang JSON moi trang
    #   - .md  : file README.md chuan cua plugin (khong phai du lieu nhay cam)
    # Cac duoi ngu hiem (ini/log/sh/sql/bak/conf/yml/dist/lock) VAN bi chan
    # nhu truoc -> khong lam giam muc do bao mat cua he thong.
    location ~* \.(ini|log|sh|sql|bak|conf|yml|yaml|lock|dist)$ {
        deny all;
        return 404;
    }

    # Chan thu muc chua ma nguon nhay cam
    location ~* /(config|files/_log|files/_cron|files/_dumps|files/_sessions)/ {
        deny all;
        return 404;
    }

    # ---------- BIEU TUONG TRINH DUYET (FAVICON) ----------
    # GLPI phat /pics/favicon.ico tu ma nguon loi -> moi the trinh duyet hien
    # logo GLPI. Day la dau vet nhan dien manh nhat: nguoi da tung dung GLPI
    # nhin thanh tab la biet ngay. Tra ve logo DLU thay the.
    #
    # Dung `location =` (khop CHINH XAC) de thang location regex ben duoi
    # (~* ^/(build|lib|pics|...)/) — nginx luon uu tien khop chinh xac.
    # Khong sua ma nguon GLPI, chi ghi de o tang gateway.
    #
    # Kieu MIME: nginx suy ra tu DUOI URI (.ico -> image/x-icon), khong phai tu
    # duoi file that. Khai bao lai bang `types` de bao dung day la anh PNG.
    location = /pics/favicon.ico {
        alias /usr/share/nginx/html/logos/logo-DLU-100sq.png;
        types { image/png ico; }
        default_type image/png;
        # `expires` tu sinh Cache-Control; KHONG dung add_header o day:
        # add_header trong location se GHI DE toan bo header bao mat cap
        # server (HSTS, X-Frame-Options...) -> favicon mat sach header.
        expires 7d;
        access_log off;
    }

    # --------------------------------------------------------------------------
    #  TAI LIEU DU AN
    # --------------------------------------------------------------------------
    #  Vi sao can: root cua server la /var/www/glpi/public, nen moi duong dan
    #  khac deu bi chuyen tiep vao GLPI -> tep .md tra ve 404. Hai location
    #  duoi day phuc vu truc tiep tu thu muc da mount (xem docker-compose.yml).
    #
    #  An toan:
    #    - Chi mount dung thu muc tai-lieu/ va tep README.md, chi doc.
    #    - Khong chua ma nguon hay mat khau that (chi co mat khau mau).
    #    - .md duoc tra ve dang text/plain; charset=utf-8 -> trinh bay tren
    #      trinh duyet, khong thuc thi duoc.
    # --------------------------------------------------------------------------
    #  BAO MAT (allowlist duoi file):
    #    Truoc day location nay phuc vu MOI file nam trong tai-lieu/ -> chi
    #    can tha mot file ca nhan (.docx de cuong, .pdf...) vao thu muc la
    #    no bi phoi cong khai qua HTTPS ngay (da kiem chung: file de cuong
    #    .docx tra ve HTTP 200). Tu day CHI phuc vu .md, .png va .html;
    #    moi duong dan khac (ke ca file khong co duoi) bi tu choi 404 -
    #    ke ca file dat vao thu muc sau nay.
    location ~* ^/tai-lieu/(?!.*\.(md|png|html)$) {
        deny all;
        return 404;
    }

    location /tai-lieu/ {
        alias /usr/share/nginx/html/tai-lieu/;
        charset utf-8;
        # nginx khong co kieu MIME cho .md -> mac dinh la
        # application/octet-stream (trinh duyet se TAI VE thay vi hien).
        # Ep text/plain de mo xem truc tiep tren trinh duyet.
        default_type text/plain;
    }

    # Slide bao ve la tep .html tu chua (khong dung CDN) -> phai render nhu
    # trang web, KHONG duoc ep text/plain nhu cac tep .md o tren. Dung
    # `location =` (khop chinh xac) de thang location /tai-lieu/ ben tren.
    location = /tai-lieu/slide-bao-ve.html {
        alias /usr/share/nginx/html/tai-lieu/slide-bao-ve.html;
        charset utf-8;
        default_type text/html;
    }

    location = /README.md {
        alias /usr/share/nginx/html/README.md;
        charset utf-8;
        default_type text/plain;
    }

    # ---------- RATE LIMITING cho trang dang nhap (chong brute-force) ----------
    #  LUU Y VE REGEX: neo cuoi la `(/|$)` chu KHONG phai `$` don thuan.
    #  URI kem PATH_INFO (/front/login.php/x) van duoc Apache dinh tuyen
    #  toi dung script dang nhap, nhung regex chi khop `$` thi location nay
    #  KHONG khop -> ke tan cong chi can them `/x` la lach sach rate limit
    #  (da do thuc te: 30 request /front/login.php/x -> 0 lan 429).
    #  lostpassword.php cung vao day vi cung la cua ngo brute-force.
    location ~* /(index\.php|front/(login|lostpassword)\.php)(/|$) {
        limit_req zone=login_zone burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://glpi:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        # Ep tieng Viet cho khach chua dang nhap (xem giai thich o map dau file)
        proxy_set_header Accept-Language $dlu_accept_language;
        proxy_http_version 1.1;
        proxy_read_timeout 600s;
    }

    # --------------------------------------------------------------------------
    #  RATE LIMITING cho ENDPOINT TAO PHIEU / XU LY PHIEU (chong spam)
    # --------------------------------------------------------------------------
    #  VAN DE (lo hong da bi chi ra khi phan bien):
    #    Ban dau nginx CHI gioi han o /front/login.php va /index.php.
    #    Endpoint tao phieu /front/ticket.form.php KHONG bi gioi han gi
    #    -> mot tai khoan bam "Luu" lien tuc co the tao hang tram phieu
    #    rac, lam ngap hang doi cua ky thuat vien.
    #
    #  GIAI PHAP:
    #    Ap zone 'ticket_zone' (30 request/phut moi IP, xem nginx.conf)
    #    cho cac endpoint tao/sua/xu ly phieu.
    #    Phu CA BA loai ITIL: ticket / problem / change - truoc day chi co
    #    ticket.form.php, con problem/change.form.php khong bi gioi han
    #    (do thuc te: 15 POST lien tiep -> 0 lan 429).
    #
    #  AN TOAN:
    #    - burst=10: cho phep bung 10 request truoc khi xep hang -> thao tac
    #      binh thuong (tao 1 phieu = 1-2 request) khong bi anh huong.
    #    - nodelay: cac request trong burst duoc xu ly NGAY, khong tre.
    #    - Vuot nguong -> HTTP 429 (khong phai 503) -> de nhan biet & kiem thu.
    #    - Chi ap cho endpoint NGHIEP VU, khong ap cho tai nguyen tinh.
    #    - Neo `(/|$)` de chan luon duong lach PATH_INFO (/x) nhu o location
    #      dang nhap ben tren.
    #
    #  LUU Y: day la tang 1/6. Cac tang con lai (tran phieu/nguoi/ngay,
    #  chong trung, kiem duyet) nam o tang nghiep vu GLPI - xem
    #  tai-lieu/README.md (muc 4).
    # --------------------------------------------------------------------------
    location ~* /front/(ticket|problem|change)\.form\.php(/|$) {
        limit_req zone=ticket_zone burst=10 nodelay;
        limit_req_status 429;

        proxy_pass http://glpi:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # --------------------------------------------------------------------------
    #  GLPI 11: ENDPOINT NOP PHIEU KIEU MOI (Symfony) — /Form/SubmitAnswers
    # --------------------------------------------------------------------------
    #  VAN DE (lo hong that, da do tren he thong dang chay):
    #    GLPI 11 co HAI duong tao phieu:
    #      - Duong cu  : POST /front/ticket.form.php   (ticket_zone da chan)
    #      - Duong moi : POST /Form/SubmitAnswers      (bieu mau Service Catalog)
    #    Bieu mau (RendererController.js) gui thang vao /Form/SubmitAnswers,
    #    va /Form/ValidateAnswers duoc goi khi chuyen muc hoac bam "Gui".
    #    Truoc day hai route nay KHONG nam trong location nao cua ticket_zone
    #    -> roi vao location / voi general_zone (600r/m burst 200), yeu hon
    #    khoang 20 lan so voi thiet ke chong spam.
    #    Da do THUC TE: 12 POST lien tiep vao /Form/SubmitAnswers -> 0 lan 429
    #    (trong khi /front/ticket.form.php -> 429 ngay tu request thu 12).
    #
    #  CACH XU LY: ap CUNG ticket_zone (30r/m burst=10) cho ca hai route.
    #  AN TOAN: ValidateAnswers chi chay khi chuyen muc / bam Gui (debounce
    #  400ms phia trinh duyet) -> nguong 30r/m + burst 10 thua suc cho nguoi
    #  dung binh thuong. Neo `(/|$)` chan luon duong lach PATH_INFO (/x).
    # --------------------------------------------------------------------------
    location ~* ^/Form/(SubmitAnswers|ValidateAnswers)(/|$) {
        limit_req zone=ticket_zone burst=10 nodelay;
        limit_req_status 429;

        proxy_pass http://glpi:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Endpoint REST API cua GLPI 11: /apirest.php va /api.php (KHONG phai
    # /api/...). Regex cu `^/api/` khong bao gio khop -> cau hinh chet,
    # va endpoint API that khong duoc bao ve (do thuc te: 40 request
    # /apirest.php -> 0 lan 429). API mac dinh TAT (enable_api=0) nhung
    # gioi han san de khi bat API thi khong ho.
    location ~* ^/(apirest|api)\.php(/|$) {
        limit_req zone=ticket_zone burst=10 nodelay;
        limit_req_status 429;

        proxy_pass http://glpi:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_http_version 1.1;
        proxy_read_timeout 600s;
    }

    # ---------- TAI NGUYEN TINH: khong gioi han tan suat ----------
    # GLPI 11 nap hang tram tep CSS/JS/font/anh cho moi trang.
    # Neu ap dung general_zone cho cac tep nay se bi 503 (da gap thuc te).
    # An toan vi day chi la tep tinh, khong truy van CSDL.
    location ~* ^/(build|lib|pics|public|plugins/[^/]+/public)/ {
        proxy_pass http://glpi:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_http_version 1.1;

        # Cho phep trinh duyet cache lai -> giam tai cho may chu.
        # `expires` tu sinh Cache-Control; KHONG dung add_header o day vi
        # add_header trong location se GHI DE toan bo header bao mat cap
        # server (HSTS, X-Frame-Options...) - da do thuc te: tep tinh mat
        # sach header bao mat.
        expires 7d;

        proxy_buffering off;
        proxy_read_timeout 600s;
    }

    # ---------- CHUYEN TIEP CHINH VAO GLPI ----------
    location / {
        limit_req zone=general_zone burst=200 nodelay;

        proxy_pass http://glpi:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        # Ep tieng Viet cho khach chua dang nhap (xem giai thich o map dau file)
        proxy_set_header Accept-Language $dlu_accept_language;
        proxy_http_version 1.1;

        # Tat buffer de ho tro tai file lon (bao cao, tep dinh kem)
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
