user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 2048;
    server_tokens off;

    # Gzip nen du lieu, tang toc do tai trang
    gzip  on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript
               application/x-javascript application/xml+rss
               application/javascript application/json;

    # Rate limiting: chong brute-force dang nhap
    # login_zone  : rat chat cho trang dang nhap (chong do mat khau)
    # general_zone: thoang cho tai nguyen tinh (CSS/JS/font/anh) - GLPI 11
    #               nap hang tram tep moi trang nen KHONG the dat qua thap,
    #               neu khong se bi 503 nhu da gap khi dung Chrome that.
    limit_req_zone $binary_remote_addr zone=login_zone:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=general_zone:10m rate=600r/m;

    # Khi vuot nguong thi XEP HANG cho (burst=200) thay vi tra 503 ngay.
    limit_req_status 429;

    # Rate limiting: chong SPAM NOP PHIEU (khac brute-force dang nhap).
    #
    # VI SAO PHAI CO RIENG ZONE NAY?
    #   Zone 'general_zone' (600r/m) ap cho moi request -> KHONG du de chan
    #   mot tai khoan bam "Luu" lien tuc tren form tao phieu, vi moi lan luu
    #   chi tinh la 1 request, con 600 request/phut thi qua rong.
    #
    #   Zone nay dat CHAT HON cho rieng endpoint tao phieu va xu ly hanh dong
    #   tren phieu (ticket.form.php). Vd: 30 request/phut = toi da khoang
    #   30 lan bam luu/phut cho MOI IP.
    #
    # LUU Y QUAN TRONG - VI SAO KHONG DAT QUA CHAT:
    #   Khuon vien truong thuong dung NAT chung: ca mot phong may (35-40 may)
    #   di ra ngoai bang MOT dia chi IP. Neu dat nguong theo IP qua thap thi
    #   mot lop hoc dang thao tac co the bi chan OAN.
    #   => Tang mang (nginx) giu nguong RONG co y thuc.
    #   => Tang nghiep vu (GLPI) moi siet chinh xac theo TAI KHOAN.
    #   Day la thiet ke 2 tang co chu dich, khong phai bo sot.
    limit_req_zone $binary_remote_addr zone=ticket_zone:10m rate=30r/m;

    include /etc/nginx/conf.d/*.conf;
}
